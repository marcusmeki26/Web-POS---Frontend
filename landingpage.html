<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/main.css"> 
    <title>Web POS</title>
</head>
<body id="body" class="h-screen w-full flex bg-primaryBg body">
    <!-- Add navigation -->
    <nav class="flex-1 border-r-1 border-borderColor w-fit">
        <div class="flex justify-center border-b border-borderColor">
            <img class="max-w-5p" src="/Web POS Logo.png" alt="Web POS Logo">
            <div class="flex flex-col justify-center">
                <span class="font-brand font-extrabold text-primaryColor text-sm">Web POS</span>
                <span class="font-light text-secondaryColor text-[.5rem]">Simple Sales, Powerful Business</span>
            </div>
        </div>
        <ul id="navigation-list" class="pl-[1rem] pt-[.5rem] pr-[1rem]">
        </ul>
    </nav>
    <div class=" flex-6 flex flex-col h-full w-fit">
        <header class="bg-secondaryBg border-b-1 border-borderColor">
            <div class="flex-1 flex justify-between items-center pl-[.5rem] pr-[.5rem] h-[2.8rem]">

                <div class="flex gap-[.5rem] items-center">
                    <div class="flex bg-white h-full gap-[.5rem] p-[.4rem] border border-borderColor rounded-sm" id="date-time-container">
                    </div>
                    <div class="bg-white h-full p-[.4rem] border border-borderColor rounded-sm cursor-pointer">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.9999 10.5V9.99995C18.9999 6.22876 18.9999 4.34311 17.8283 3.17154C16.6568 2 14.7712 2 11 2C7.22883 2 5.3432 2.00006 4.17163 3.17159C3.00009 4.34315 3.00007 6.22872 3.00004 9.99988L3 14.5C2.99997 17.7874 2.99996 19.4312 3.90788 20.5375C4.07412 20.7401 4.25986 20.9258 4.46242 21.0921C5.56877 22 7.21249 22 10.4999 22" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

                            <path d="M18 18.5L16.5 17.95V15.5M12 17.5C12 19.9853 14.0147 22 16.5 22C18.9853 22 21 19.9853 21 17.5C21 15.0147 18.9853 13 16.5 13C14.0147 13 12 15.0147 12 17.5Z" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="text-dividerColor"> | </span>
                    <div id="user-collapsible" class="flex items-center gap-[.3rem] bg-white h-full p-[.4rem] border border-borderColor rounded-sm">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 9C15 7.34315 13.6569 6 12 6C10.3431 6 9 7.34315 9 9C9 10.6569 10.3431 12 12 12C13.6569 12 15 10.6569 15 9Z" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17 17C17 14.2386 14.7614 12 12 12C9.23858 12 7 14.2386 7 17" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="text-xs text-primaryColor">Cashier's Name</span>
                        <svg class="cursor-pointer" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="#3A6EA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </header>
        <section id="app" class="flex-3 min-h-0">
    
        </section>
    </div>
    <script type="module" src="./src/js/landingpage.js"></script>
</body>
</html>
