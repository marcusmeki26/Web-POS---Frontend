<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/css/main.css"> 
  <title>Web POS Login Page</title>
</head>
<body class="h-screen flex justify-center items-center">
  <section id="login-container" class="shadow-sm p-5 rounded-sm">
    <form id="login-form" class="flex flex-col gap-2">
      <div class="flex flex-col">
        <label for="user-id" class="text-accentBtn leading-none">Enter ID</label>
        <input id="user-id" type="text" class="border rounded-sm border-accentBtn outline-0 pl-[.3rem]">
      </div>
      <div class="flex flex-col">
        <label for="user-id" class="text-accentBtn leading-none">Password</label>
        <input id="user-password" type="password" class="border rounded-sm border-accentBtn outline-0 pl-[.3rem]">
      </div>
      <button type="submit" class="bg-accentBtn rounded-sm text-whiteText p-1 cursor-pointer hover:bg-accentHvrActive">Login</button>
    </form>
  </section>
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
